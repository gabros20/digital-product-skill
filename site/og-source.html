<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>digital-product — OG image source</title>
<style>
  /* Rendered to og.png at 1200x630. The rail is the family's real shape: eight stages, fourteen
     skills, Build carrying five. Lit nodes are one honest minimal path (a solo-founder SaaS MVP);
     the unlit ones are the stages that path deliberately skips. */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:#131316;
    background-image:
      radial-gradient(circle at 84% 12%, color-mix(in srgb, #6366f1 22%, transparent), transparent 46%),
      radial-gradient(circle at 6% 96%, color-mix(in srgb, #6366f1 10%, transparent), transparent 44%);
    color:#e8e8ee;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    position:relative;
  }
  .frame{position:absolute; inset:40px; border:1px solid #2e2e36; border-radius:18px}
  .content{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; padding:0 96px}
  .eyebrow{
    font-family:"Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;
    text-transform:uppercase; letter-spacing:.18em; font-weight:600;
    font-size:19px; color:#9494a0; margin-bottom:22px;
  }
  h1{font-size:100px; font-weight:500; letter-spacing:-.025em; line-height:1; margin-bottom:24px}
  h1 .sl{color:#9698f9}
  .sub{
    font-family:"Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;
    font-size:29px; color:#9494a0; letter-spacing:.01em; margin-bottom:52px;
  }
  .rail{display:flex; align-items:flex-end; gap:0; width:1008px}
  .seg{flex:1 1 0; display:flex; flex-direction:column; align-items:center; gap:13px; border-left:1px solid #2e2e36; padding:0 6px}
  .seg:first-child{border-left:none}
  .dots{display:flex; gap:9px; align-items:center; min-height:14px}
  .dots i{width:13px; height:13px; border-radius:50%; display:block; flex:none}
  .dots i.on{background:#9698f9}
  .dots i.off{background:#2e2e36}
  .nm{
    font-family:"Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;
    text-transform:uppercase; letter-spacing:.08em; font-weight:600;
    font-size:16px; color:#64646f;
  }
  .seg.lit .nm{color:#e8e8ee}
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="content">
    <div class="eyebrow">the composer for fourteen specialist agent skills</div>
    <h1><span class="sl">/</span>digital-product</h1>
    <div class="sub">Fifteen skills, one product lifecycle — and only the stages you need</div>
    <div class="rail">
      <div class="seg lit"><div class="dots"><i class="on"></i></div><div class="nm">Define</div></div>
      <div class="seg lit"><div class="dots"><i class="on"></i></div><div class="nm">Design</div></div>
      <div class="seg lit"><div class="dots"><i class="on"></i></div><div class="nm">Shape</div></div>
      <div class="seg lit"><div class="dots"><i class="on"></i><i class="on"></i><i class="off"></i><i class="off"></i><i class="off"></i></div><div class="nm">Build</div></div>
      <div class="seg lit"><div class="dots"><i class="on"></i></div><div class="nm">Assure</div></div>
      <div class="seg lit"><div class="dots"><i class="on"></i></div><div class="nm">Run</div></div>
      <div class="seg"><div class="dots"><i class="off"></i><i class="off"></i></div><div class="nm">Improve</div></div>
      <div class="seg"><div class="dots"><i class="off"></i><i class="off"></i></div><div class="nm">Distribute</div></div>
    </div>
  </div>
</body>
</html>
